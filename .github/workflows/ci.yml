name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install agent frontmatter parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Claude-native agent definitions carry the role sources
        run: python3 .github/check-agents.py
      - name: Hook emits a valid, bounded SessionStart forced-read instruction
        run: |
          chmod +x hooks/session-start
          env -u PLUGIN_DATA CLAUDE_PLUGIN_DATA=test ./hooks/session-start > /tmp/hook-out.json
          python3 - <<'EOF'
          import json
          raw = open('/tmp/hook-out.json', 'rb').read()
          # (c) total hook output stays well under the harness's ~10KB inline cap on
          # additionalContext, so delivery can never silently regress to a 2KB preview
          # (issue #35, ADR 0019). This is the byte gate the cap itself never gave us.
          assert len(raw) < 4000, f'hook output {len(raw)} bytes must stay < 4000'
          d = json.loads(raw)
          out = d['hookSpecificOutput']
          # (a) valid JSON, SessionStart event.
          assert out['hookEventName'] == 'SessionStart'
          ctx = out['additionalContext']
          assert 'DevStandard' in ctx
          # (b) it names core.md and carries the forced before-acting read instruction (issue #56 wording).
          assert 'core.md' in ctx, 'additionalContext must name core.md'
          assert 'IN FULL' in ctx and 'before acting' in ctx, 'additionalContext must force the before-acting read'
          print(f'hook OK, {len(raw)} bytes total, additionalContext {len(ctx)} chars')
          EOF
      - name: core.md stays within its token budget
        run: |
          python3 - <<'EOF'
          words = len(open('core.md').read().split())
          tokens = int(words * 1.35)
          print(f'core.md ~{tokens} tokens (ceiling 5000, ADR 0007 as amended)')
          assert tokens <= 5000, 'core.md exceeds the every-session budget (ADR 0007 as amended, ceiling 5000)'
          EOF
      - name: No @path references (they force-load context)
        run: |
          ! grep -rn "@[a-zA-Z0-9_-]*/" core.md reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: Every ADR amendment block is announced by its status line
        run: python3 .github/check-adr-index.py
      - name: the two Claude plugin manifests stay in lockstep (main is what the marketplace installs)
        run: |
          python3 - <<'EOF'
          import json
          p = json.load(open('.claude-plugin/plugin.json'))['version']
          m = json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version']
          assert p == m, f'plugin.json={p} != marketplace.json={m}'
          print('versions in lockstep:', p)
          EOF

      - name: Claude-only hook preserves delivery and warns on unsupported environments
        run: |
          python3 - <<'PYHOOK'
          import json, os, pathlib, subprocess
          hook = str(pathlib.Path('hooks/session-start').resolve())
          base = {k:v for k,v in os.environ.items() if k not in ('PLUGIN_DATA', 'CLAUDE_PLUGIN_DATA')}
          for extra in ({'CLAUDE_PLUGIN_DATA':'/x'}, {'PLUGIN_DATA':'/inherited', 'CLAUDE_PLUGIN_DATA':'/x'}):
              for source in ('startup', 'clear', 'compact', ''):
                  result = subprocess.run([hook], input=json.dumps({'source':source}), text=True,
                                          capture_output=True, cwd='/tmp', env=base | extra, timeout=5, check=True)
                  out = json.loads(result.stdout)
                  ctx = out['hookSpecificOutput']['additionalContext']
                  assert out['hookSpecificOutput']['hookEventName'] == 'SessionStart'
                  assert len(result.stdout.encode()) < 4000
                  assert all(word in ctx for word in ('DevStandard', 'core.md', 'IN FULL', 'before acting'))
                  if source:
                      assert f'(source: {source})' in out['systemMessage']
                  else:
                      assert '(source:' not in out['systemMessage']
          for extra in ({}, {'CLAUDE_PLUGIN_DATA':''}, {'PLUGIN_DATA':'/x'},
                        {'PLUGIN_DATA':'/x', 'CLAUDE_PLUGIN_DATA':'/x'}):
              result = subprocess.run([hook], input='', text=True, capture_output=True,
                                      cwd='/tmp', env=base | extra, timeout=5, check=True)
              out = json.loads(result.stdout)
              assert out['hookSpecificOutput']['hookEventName'] == 'SessionStart'
              assert 'unknown harness' in out['systemMessage'], extra
              assert 'core.md' not in result.stdout and 'IN FULL' not in result.stdout, extra
          print('Claude delivery and unsupported-environment warning OK')
          PYHOOK

      - name: Codex host packaging and delivery are retired
        run: |
          test ! -e .codex-plugin
          test ! -e reference/harness-codex.md
          ! grep -q 'harness=codex' hooks/session-start
          ! grep -q 'frozen' docs/architecture.md
          grep -q 'removed from scope' docs/architecture.md
          echo 'Codex host retirement OK'

      - name: live pages carry the surviving 0039/0040 invariants and none of the retired claims
        run: |
          set -e
          # This asserts only DevStandard's documentation path shape; semantic admission remains merge check 1.
          python3 - <<'PY'
          import pathlib,re,subprocess

          paths=subprocess.check_output(["git","ls-files","-z"]).decode().rstrip("\0").split("\0")
          markdown=[p for p in paths if pathlib.PurePosixPath(p).suffix.lower()==".md"]
          candidates=[p for p in markdown if "/" not in p or p.split("/",1)[0].casefold()=="docs"]
          root={"README.md","CLAUDE.md","core.md"}
          allowed=[]
          rejected=[]
          for path in candidates:
              ok=(
                  ("/" not in path and path in root)
                  or path in {"docs/PRD.md","docs/architecture.md"}
                  or re.fullmatch(r"docs/adr/\d{4}-[^/]+\.md",path)
                  or re.fullmatch(r"docs/specs/\d{4}-\d{2}-\d{2}-[^/]+\.md",path)
                  or re.fullmatch(r"docs/architecture/[^/]+\.md",path)
              )
              (allowed if ok else rejected).append(path)
          assert not rejected, f"non-canonical documentation paths: {rejected}"
          folded={}
          for path in allowed:
              folded.setdefault(path.casefold(),[]).append(path)
          duplicates=[group for group in folded.values() if len(group)>1]
          assert not duplicates, f"case-folded documentation path collisions: {duplicates}"

          predicate=pathlib.Path("reference/in-repo-writes.md").read_text().splitlines()
          start="<!-- BEGIN IN-REPO-WRITES PREDICATE -->"
          end_re=re.compile(r"<!-- END IN-REPO-WRITES PREDICATE \((\d+) payload lines\) -->")
          starts=[i for i,line in enumerate(predicate) if line==start]
          ends=[(i,end_re.fullmatch(line)) for i,line in enumerate(predicate) if end_re.fullmatch(line)]
          assert len(starts)==1 and len(ends)==1, "predicate block must have exactly one start and one counted end marker"
          begin=starts[0]
          end,match=ends[0]
          assert begin<end, "predicate block markers are reversed"
          actual=end-begin-1
          declared=int(match.group(1))
          assert actual==declared, f"predicate block declares {declared} payload lines, found {actual}"
          print(f"documentation paths canonical; predicate block {actual} payload lines")
          PY
          # retirement asserted, not assumed
          test ! -e .devstandard || { echo ".devstandard survives"; exit 1; }
          test ! -e scripts/codex-adopt || { echo "codex-adopt survives"; exit 1; }
          test ! -e AGENTS.md || { echo "managed AGENTS.md survives"; exit 1; }
          grep -qxF "/.claude/worktrees/" .gitignore || { echo "worktree ignore line missing"; exit 1; }
          # Retired identity/adoption claims; Claude orchestration is supported again (0045).
          for pat in "if unsure whether" "one ongoing primary session" "never the main session" "codex-adopt" ".devstandard"; do
            if grep -rnF "$pat" core.md reference/ README.md docs/architecture.md docs/PRD.md CLAUDE.md hooks/session-start .claude-plugin/*.json | grep -v "docs/adr\|docs/specs\|Migrating from v0.27"; then
              echo "retired claim found: $pat"; exit 1
            fi
          done
          # positive invariants
          grep -q "operational-memory file on every harness" reference/repo-claude-md.md
          grep -q "Dispatched work goes to Codex where it is installed" core.md   # 0040 wording
          # 0040: the standing model/effort record is stated exactly once, dated, on the dispatch page; the
          # model is not named on any other live page (a bare mention elsewhere is a partial restatement).
          # On the dispatch page itself only the full record is counted, so a mechanics or compatibility
          # note there may name the model. ADR and spec history excluded by design; counted by
          # occurrence and by path, not by line or by text.
          python3 - <<'PY'
          import glob,re,sys
          page="reference/external-agent.md"
          # live pages = everything a session may read as instruction, enumerated dynamically; ADR and spec history excluded
          hist=("docs/adr/","docs/specs/","_source/",".claude/",".git/","node_modules/")
          live=["hooks/session-start"]+[f for f in glob.glob("**/*.md",recursive=True) if not f.startswith(hist)]
          # the record is READ from the canonical sentence, never repeated here: exactly one such sentence exists
          # across ALL live pages, and it is on the dispatch page
          canon=r"The standing setting on these projects is `([^`]+)`"
          found=[(f,m) for f in live for m in re.findall(canon, open(f).read())]
          assert len(found)==1 and found[0][0]==page, f"canonical standing-setting sentences: {[f for f,_ in found]} — want exactly one, on {page}"
          rec=found[0][1]; t=open(page).read()
          # the record must be exactly `-m MODEL -c model_reasoning_effort=EFFORT` — a full-match grammar, so a
          # dropped flag, a missing value, or an option token in a value position fails
          g=re.fullmatch(r"-m ([^\s`-][^\s`]*) -c model_reasoning_effort=([^\s`-][^\s`]*)", rec)
          assert g, f"standing setting record does not match `-m MODEL -c model_reasoning_effort=EFFORT`: {rec!r}"
          model,effort=g.group(1),g.group(2)
          n=t.count(rec); assert n==1, f"standing setting record appears {n} times on {page}, want 1"
          para=[p for p in t.split("\n\n") if rec in p][0]
          assert re.search(r"20\d\d-\d\d-\d\d", para), "standing setting paragraph carries no date"
          for f in live:
              if f==page: continue
              assert model not in open(f).read(), f"standing setting model {model!r} restated in {f}"
          print(f"standing setting: once, dated, single-sited (model {model}, read from the page)")
          PY
          grep -q "A development method for Claude Code:" .claude-plugin/plugin.json
          grep -q "A development method for Claude Code:" .claude-plugin/marketplace.json
          grep -q "Codex" README.md
          grep -q "Claude Code and Codex" docs/PRD.md
          ! grep -q "devstandard-fallback" README.md reference/in-repo-writes.md
          grep -q "this brief is what makes you a worker" reference/worker-brief.md || grep -qi "This brief is what makes you a worker" reference/worker-brief.md
          grep -q "every dispatched worker receives, or opens" core.md
          # worktree-ignore trigger sites (all five)
          grep -q "check-ignore -q .claude/worktrees/probe" core.md
          grep -q "seeds the in-repo worktree root" reference/ci-pipelines.md || grep -q "worktree root into" reference/ci-pipelines.md
          grep -q "check-ignore -q .claude/worktrees/probe" reference/worktree-lifecycle.md
          grep -q "pre-creation ignore check" reference/external-agent.md
          grep -q "check-ignore -q .claude/worktrees/probe" reference/worker-brief.md
          # per-ADR 0039 presence
          for a in 0006 0007 0008 0015 0016 0018 0019 0024 0038; do
            grep -l "Amended by 0039 (2026-08-26)" docs/adr/${a}-*.md >/dev/null || { echo "ADR $a missing 0039 status entry"; exit 1; }
            grep -l "see 0039" docs/adr/${a}-*.md >/dev/null || { echo "ADR $a missing 0039 block"; exit 1; }
          done
          # The installed footprint is Claude-only; process execution still uses the worker brief.
          grep -q 'core.md` on Claude Code' README.md
          ! grep -n 'harness-codex.md' core.md reference/*.md README.md
          grep -q 'CLI executor' README.md
          echo "static assertions OK"
