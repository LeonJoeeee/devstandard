name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hook emits a valid, bounded SessionStart forced-read instruction
        run: |
          chmod +x hooks/session-start
          env -u PLUGIN_DATA CLAUDE_PLUGIN_DATA=test ./hooks/session-start > /tmp/hook-out.json
          python3 - <<'EOF'
          import json
          raw = open('/tmp/hook-out.json', 'rb').read()
          # (c) total hook output stays well under the harness's ~10KB inline cap on
          # additionalContext, so delivery can never silently regress to a 2KB preview
          # (issue #35, ADR 0019). This is the byte gate the cap itself never gave us.
          assert len(raw) < 4000, f'hook output {len(raw)} bytes must stay < 4000'
          d = json.loads(raw)
          out = d['hookSpecificOutput']
          # (a) valid JSON, SessionStart event.
          assert out['hookEventName'] == 'SessionStart'
          ctx = out['additionalContext']
          assert 'DevStandard' in ctx
          # (b) it names core.md and carries the forced before-acting read instruction (issue #56 wording).
          assert 'core.md' in ctx, 'additionalContext must name core.md'
          assert 'IN FULL' in ctx and 'before acting' in ctx, 'additionalContext must force the before-acting read'
          print(f'hook OK, {len(raw)} bytes total, additionalContext {len(ctx)} chars')
          EOF
      - name: core.md stays within its token budget
        run: |
          python3 - <<'EOF'
          words = len(open('core.md').read().split())
          tokens = int(words * 1.35)
          print(f'core.md ~{tokens} tokens (ceiling 5000, ADR 0007 as amended)')
          assert tokens <= 5000, 'core.md exceeds the every-session budget (ADR 0007 as amended, ceiling 5000)'
          EOF
      - name: No @path references (they force-load context)
        run: |
          ! grep -rn "@[a-zA-Z0-9_-]*/" core.md reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: Every ADR amendment block is announced by its status line
        run: python3 .github/check-adr-index.py
      - name: the three plugin manifests stay in lockstep (main is what each marketplace installs)
        run: |
          python3 - <<'EOF'
          import json
          p = json.load(open('.claude-plugin/plugin.json'))['version']
          m = json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version']
          c = json.load(open('.codex-plugin/plugin.json'))['version']
          assert p == m == c, f'claude plugin.json={p} != marketplace.json={m} != codex plugin.json={c}'
          print('versions in lockstep:', p)
          EOF

      - name: Codex branch delivers the worker role only in marked repos; unknown harness warns
        run: |
          chmod +x hooks/session-start
          set -e
          mkdir -p /tmp/ds-marked && cd /tmp/ds-marked && git init -q . && touch .devstandard
          OUT=$(PLUGIN_DATA=/x CLAUDE_PLUGIN_DATA=/x "$GITHUB_WORKSPACE/hooks/session-start" < /dev/null)
          echo "$OUT" | grep -q "DEVSTANDARD-CODEX-ROLE-V1" || { echo "marked repo: sentinel missing"; exit 1; }
          echo "$OUT" | python3 -c 'import json,sys; json.load(sys.stdin)'
          mkdir -p /tmp/ds-unmarked && cd /tmp/ds-unmarked && git init -q .
          OUT=$(PLUGIN_DATA=/x CLAUDE_PLUGIN_DATA=/x "$GITHUB_WORKSPACE/hooks/session-start" < /dev/null)
          [ -z "$OUT" ] || { echo "unmarked repo: expected empty output"; exit 1; }
          OUT=$(env -u PLUGIN_DATA -u CLAUDE_PLUGIN_DATA "$GITHUB_WORKSPACE/hooks/session-start" < /dev/null)
          echo "$OUT" | grep -q "unknown harness" || { echo "unknown-harness warning missing"; exit 1; }
          echo "codex-branch gate OK"

      - name: the Codex worker page stays within its byte budget
        run: |
          size=$(wc -c < reference/harness-codex.md)
          test "$size" -le 8192 || { echo "harness-codex.md is $size bytes (> 8192)"; exit 1; }
          echo "harness-codex.md $size bytes (<= 8192)"

      - name: live pages carry the leader/executor clauses and none of the retired claims
        run: |
          set -e
          grep -q "never merge, tag, or release" reference/harness-codex.md
          grep -q "a Codex session is never the main session" reference/worker-brief.md
          grep -q "defaults to Codex where it is installed" core.md
          # retired claims must not survive in live pages (docs/adr and docs/specs keep history).
          # explicit if/exit: `set -e` exempts `!`-prefixed pipelines, so a bare `! grep` cannot fail the step
          if grep -rn "this file is \`AGENTS.md\`" core.md reference/ README.md docs/architecture.md; then echo "retired claim found"; exit 1; fi
          if grep -rn "pointer at the installed" core.md reference/ README.md docs/architecture.md; then echo "retired claim found"; exit 1; fi
          echo "static assertions OK"
