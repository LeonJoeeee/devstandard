name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Test (the same checks CI runs gate the release)
        run: |
          python3 .github/test-codex-plugin.py
          python3 .github/test-session-start.py
          python3 .github/check-core-budget.py
          ! grep -rn "@[a-zA-Z0-9_-]*/" core.md reference/ --include='*.md' \
            | grep -v "actions/" | grep -v "anthropic" | grep .
      - name: Versions must match the tag
        run: |
          python3 - <<'EOF'
          import json, os
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          p = json.load(open('.claude-plugin/plugin.json'))['version']
          m = json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version']
          c = json.load(open('.codex-plugin/plugin.json'))['version']
          assert p == m == c == tag, f'Claude plugin={p} marketplace={m} Codex plugin={c} tag={tag}'
          EOF
      - name: Publish GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to publish."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
